services:
  database:
    container_name: holidex-database
    build: ./database
    ports:
      - "3309:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  localstack:
    container_name: holidex-localstack
    build: ./localstack
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init:/etc/localstack/init
      - ./localstack/data:/var/lib/localstack

  io:
    container_name: holidex-io
    build: ./io
    ports:
      - "3004:3004"

  backend:
    container_name: holidex-backend
    build: ./backend
    environment:
      NODE_ENV: compose
    ports:
      - "3020:3000"
    depends_on:
      database:
        condition: service_healthy
      localstack:
        condition: service_started
      io:
        condition: service_started

  frontend:
    container_name: holidex-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.compose
    ports:
      - "3012:80"
    depends_on:
      backend:
        condition: service_started
      io:
        condition: service_started
